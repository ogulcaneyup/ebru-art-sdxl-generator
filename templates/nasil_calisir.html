<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebru AI - Nasıl Çalışır?</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header id="mainHeader">
        <div class="logo">Ebru<span>.AI</span></div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">Anasayfa</a></li>
                <li><a href="{{ url_for('nasil_calisir') }}" class="active">Nasıl Çalışır?</a></li>
                <li><a href="{{ url_for('ornekler') }}">Galeri</a></li>
                <li><a href="{{ url_for('proje_ekibi') }}">Hakkımızda</a></li>
            </ul>
        </nav>
    </header>

    <div class="content-section">
        <h2 class="page-title">Sistem <span class="gradient-text">Mimarisi</span></h2>
        <p class="page-subtitle">Geleneksel sanatın yapay zeka ile işlenme serüveni.</p>
        
        <div class="timeline-container">
            
            <div class="step-row">
                <div class="step-text-area">
                    <div class="step-number">01</div>
                    <h3 class="typewriter-heading gradient-text" data-text="Kullanıcı İstemi (Prompting)"></h3>
                    <p class="typewriter-text" data-text="Kullanıcı, hayalindeki sahneyi doğal Türkçe diliyle sisteme girer. Örneğin: 'Boğazda gün batımı'. Sistem bu ham veriyi alır ve işleme hattına sokar."></p>
                </div>
                <div class="step-image-area">
                    <div class="image-wrapper">
                        <img src="{{ url_for('static', filename='images/image1.png') }}" alt="Adım 1 Görseli" onerror="this.src='https://images.unsplash.com/photo-1541701494587-cb58502866ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
                        <div class="overlay"></div>
                    </div>
                </div>
            </div>

            <div class="step-row reverse">
                <div class="step-text-area">
                    <div class="step-number">02</div>
                    <h3 class="typewriter-heading gradient-text" data-text="NLP Çeviri Katmanı"></h3>
                    <p class="typewriter-text" data-text="Backend sunucusu, gelen Türkçe metni Google Translate API altyapısını kullanarak İngilizceye çevirir ve 'Prompt Engineering' modülü ile Ebru sanatına uygun teknik terimleri komuta ekler."></p>
                </div>
                <div class="step-image-area">
                    <div class="image-wrapper">
                        <img src="{{ url_for('static', filename='images/image2.png') }}" alt="Adım 2 Görseli" onerror="this.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
                        <div class="overlay"></div>
                    </div>
                </div>
            </div>

            <div class="step-row">
                <div class="step-text-area">
                    <div class="step-number">03</div>
                    <h3 class="typewriter-heading gradient-text" data-text="Difüzyon Modeli & Render"></h3>
                    <p class="typewriter-text" data-text="Hazırlanan komut, GPU üzerinde çalışan SDXL modeline iletilir. Model, 'Gürültüden Arındırma' (Denoising) işlemiyle 20 adımda piksel piksel Ebru sanatını oluşturur ve sonucu kullanıcıya sunar."></p>
                </div>
                <div class="step-image-area">
                    <div class="image-wrapper">
                        <img src="{{ url_for('static', filename='images/image3.png') }}" alt="Adım 3 Görseli" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
                        <div class="overlay"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 Ebru AI - TÜBİTAK Projesi - Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
